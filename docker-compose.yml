version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: procureflow-db
    environment:
      POSTGRES_DB: procureflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - procureflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procureflow-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: procureflow
      DB_USER: postgres
      DB_PASSWORD: postgres
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - procureflow-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: procureflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - procureflow-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  procureflow-network:
    driver: bridge
