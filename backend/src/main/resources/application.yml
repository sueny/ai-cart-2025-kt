spring:
  application:
    name: procureflow

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:procureflow}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    # AI Provider selection: openai, claude, or gemini
    provider: ${AI_PROVIDER:openai}

    openai:
      api-key: ${OPENAI_API_KEY:dummy}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o}
          temperature: 0.2

    anthropic:
      api-key: ${ANTHROPIC_API_KEY:dummy}
      chat:
        options:
          model: ${CLAUDE_MODEL:claude-3-5-sonnet-20241022}
          temperature: 0.2
    vertex:
      ai:
        gemini:
          project-id: ${GCP_PROJECT_ID:dummy}
          location: ${GCP_LOCATION:us-central1}
          chat:
            options:
              model: ${GEMINI_MODEL:gemini-2.0-flash}
              temperature: 0

server:
  port: ${PORT:8080}

logging:
  level:
    com.procureflow: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: DEBUG
