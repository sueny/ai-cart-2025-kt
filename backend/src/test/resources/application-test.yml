spring:
  application:
    name: procureflow-test

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    openai:
      api-key: test-key
      chat:
        options:
          model: gpt-4-turbo-preview
          temperature: 0.7

logging:
  level:
    com.procureflow: DEBUG
    org.springframework.ai: WARN
    org.hibernate: WARN
    org.testcontainers: WARN
